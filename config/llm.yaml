# LLM 通道（批2）。`llm:` 与 `retry:` 是**根级并列键**：重试策略读 cfg.retry，不是 cfg.llm.retry。
llm:
  # **必须改成你自己的 OpenAI 兼容端点**：这里放的是占位值，任何 provider 都可以
  # （官方 API、自建网关、本地 ollama 都行）。也可以用环境变量 `LLM_BASE_URL` 覆盖。
  # 不要把别人部署的中转站写进默认值——新用户不核对就会把自己的 API key 发过去。
  base_url: https://api.example.com/v1
  api_key_env: DEEPSEEK_API_KEY     # 密钥从环境变量读，yaml 里只放变量名
  model: deepseek-flash
  thinking: disabled                # 默认关闭；要开时 max_tokens 须 ≥2000

  timeouts:
    # **单次调用的超时（秒）。`0` = 不设超时，一直等到上游返回**。
    #
    # 这是默认值，理由来自一次生产故障：中转站在开盘繁忙时段**单次调用要
    # 23–31 秒**（连只回 1 个 token 的请求也是——是网关排队，不是生成慢）。
    # 设成 20 秒后，每次 attempt 必然超时，整个交易日 100% 回合失败。
    #
    # 所以默认**不设业务上限**（写 0），靠三件事兜住：
    #   1. 错误自动重试（`retry.max_attempts`，429/502/503/504/超时/空响应都重试）
    #   2. 回合轮数（`agent/main.py` 的 `*_ROUNDS_BUDGET`）——跑满就退出
    #   3. **兜底硬上限**（代码里的 `SAFETY_TIMEOUT_S` = 300 秒 / 回合 600 秒）：
    #      只有"上游彻底不回包"才会撞上。没有它，一次永久挂住会让整个 agent 停摆
    #
    # 想限制单次调用时长时，改成一个正数即可（会覆盖兜底值）。
    agent_call_s: 0
    chat_s: 0
  max_tokens:
    plain: 1000        # grounding 重写路径实际用的值（原写 800，与代码不符）
    tools: 2000        # 主回合与对话实际用的值
  # [输入上限, 输出上限]；agent 与对话两个池各算各的（对话烧爆不该让盯盘闭嘴）
  budget:
    # 预算是**保守预扣**：每个 attempt 发出前扣「字符数×0.7 + max_tokens」，
    # 之后不退款（`llm/budget.py` 明确"不可退还、无退款路径"）。
    #
    # **按实际调度复算，不要凭直觉估**（v0.2.73–0.2.74 连续修正三次）：
    #
    # 1) 先算**一天的回合数**：心跳节奏见 `agent/schedule.py`
    #    （09:15–10:00 与 14:30–15:00 每 2 分钟、其余 5 分钟、两段午间 10 分钟），
    #    全天约 68 次；再加事件唤醒与闹钟，合计约 100+ 个回合。
    #    **不要用"每 10 分钟一次"去估**——那会把回合数少算一半。
    # 2) 再算**每回合的 attempt 数**：一个回合可能跑多轮工具调用 + grounding 重写
    #    + 重试，实测约 2 倍于回合数。
    # 3) 保守预扣约为真实 token 用量的 **1.3~1.8 倍**（每个 attempt 发请求前扣
    #    「字符数×0.7 + max_tokens」，不退款）。要自己核对口径，
    #    直接算 `token_audit` 的 `sum(reserve_in) / sum(real_in)`。
    #
    #    **这里以前写的是 3 倍，v0.2.103 改掉了**：旧系数 `chars×1.2` 是按
    #    "中文 1 字 ≈ 1 token" 拍的，而生产实测（247 条真实 `prompt_tokens`）
    #    的 token/字符 中位只有 **0.383**、最大 0.530——上下文里大半是 JSON
    #    （工具 schema、工具返回），JSON 标点 tokenize 得极省。
    #    于是 1.2 系统性高估 3.1 倍，5.5M 名义额度实际只够跑 1.87M，
    #    11-20 暴跌日就这样在 **13:27** 用完了（当天 327 个回合）。
    #    换成 0.7（对实测最大值仍留 32% 余量）后，同样的额度覆盖约 **1.4~1.5 倍**
    #    回合——**不是理论上的 1.7 倍**，因为 `out` 会先打满（见下）。
    #
    #    系数定义在 `llm/budget.py::CHARS_TO_TOKENS`（agent 池与 chat 池共用）。
    #
    # 按上面三步反推，本档位覆盖全天并留有余量。**换模型/换行情波动都要重算**，
    # 尤其是输出维度：`out` 要够每个 attempt 的 max_tokens 预留。
    #
    # **输出维度通常先打满**（第六轮评审 M1）：每次 attempt 固定预留
    # `MAX_TOKENS = 2000`，实测真实输出只有约 230。所以 `agent` 的 [输入, 输出]
    # 两维里，`out` 才是真正的容量瓶颈——11-20 是 249 attempt / 输出 458000 / 700000，
    # 改后输入能撑 428 次但输出只撑 350 次。**评估容量请看 out，不要只看 in。**
    agent: [5500000, 700000]
    chat: [200000, 20000]
  pricing:                          # 只用于日志页的 cost_cny，不是账单
    in_cny_per_mtok: 2.0
    out_cny_per_mtok: 8.0
    is_estimate: true

retry:
  # **错误自动重试**。含首次，即最多 2 次重试。
  # 重试的状态码：502/503/504、超时、空响应、连接失败（http_000）。
  # **429（限流）也重试**——它是"稍后再来"，不是"你错了"。
  # 不重试：400/401/403/404（请求本身有问题，重试只会重复同样的失败）。
  # `max_attempts: 3` = 首次 + 2 次重试，所以 `backoff` **只能有 2 档**
  # （对应两次重试）。写 3 档的话第 3 档永远取不到，属于死配置。
  max_attempts: 3
  backoff: [1.0, 3.0]               # 秒，各加 ±30% 抖动；超出档位的重试沿用末值
  # `retry_on` 只接受**具体 HTTP 状态码**。
  #
  # 超时、空响应、连接失败这三类**永远重试、不可用本文件关闭**——它们不是
  # "服务器说不"，是"这次什么都没拿到"，除了再试一次没有别的处理方式。
  # 写成 `timeout`/`empty_body`/`http_000` 这类符号名不会生效（以前写在这里的
  # 那几个就是死项）。确实需要关闭它们时，只能在 `llm/client.py::classify()`
  # 里改代码，不能改配置。
  retry_on: [429, 502, 503, 504]
  never_retry: [400, 401, 403, 404]
