# agent 段的全部阈值（批2）。阈值只住在这里，代码里不写默认值。
heartbeat:
  base_min: 5
  tight_min: 2
  max_min: 10
  # 开盘与尾盘的密集时段：这两段是「错过就没了」的窗口
  tight:
    - ["09:15", "10:00"]
    - ["14:30", "15:00"]
  # 中午与午后刚开盘：没什么可看的，放松
  relaxed:
    - ["11:00", "11:30"]
    - ["13:00", "13:30"]

# **回合预算：这两段真的生效**（`agent/main.py::_turn_budget` 在启动时读取）。
# 改这里会改变运行时行为，改完重启 agent 生效。
#
# `rounds`：一个回合最多跑几轮 LLM 调用。**必须为正**，它是保证回合会结束的主界。
# `deadline_s`：回合时长上限（秒）。`0` = 不设业务上限，只保留代码里的兜底
#               `SAFETY_DEADLINE_S`（10 分钟，防上游彻底不回包时永久挂住）。
#               设正数时，铁律是 **deadline ≥ 单次调用上限 × 2**：一个回合至少
#               两次 LLM 调用（先决定查什么、拿到工具结果后再出决策）。
event:
  rounds: 3
  deadline_s: 0

heartbeat_turn:
  rounds: 6
  deadline_s: 0

context:
  max_chars: 6000
  sector_events: 8
  own_history: 10
  # `own_history_trim` 已删除（v0.2.105）：它从来没有读取点，也没有明确的语义
  #——"历史超预算时保留几条"最终由 `context.max_chars` 的整体裁剪决定。
  # 与 `memory.*` 三键同样处理：留着键却没有实现，比删掉更容易误导。

channel_b_daily_cap: 15        # 通道 B（agent 主动开口）的日上限；通道 A 不计入
# 显著度 ≥ `strategy.attention.salience_critical` 的**极端行情**可以突破上面的
# 日上限，最多再多放这么多条。硬上限会在最强的那天把最重要的消息挡掉：
# 2026-11-27 涨停 250→306，15 条额度 13:22 打满，13:43 的「涨停破 250」被静默丢弃。
channel_b_critical_extra: 3
# 两条**普通**便签之间的最小间隔（秒）：防止开盘瞬间连着推（实测 13:01:24-13:02:30
# 66 秒内推了 5 条，把一天的额度烧掉三分之一）。极端行情不受此限。
agent_note_min_gap_s: 45

fatigue:
  free: 10
  step: 5
  raise: 0.5

# ⚠️ **这三个键目前没有任何读取点**（`core/config.py` 只做类型校验与默认值）。
# 它们看着像"记忆驱动的焦点抑制"，实际并不生效——`ignored_focus: 0.7` 尤其容易误导。
# 保留键名只是为了不改动「必填键」契约（删掉会让既有配置文件加载失败）。
# 记忆的读路径是 `agent/memory.py::recall()`（上限 MAX_RECALL=3，只在事件回合加载）；
# 写路径目前不存在，当日连续性由 `【我说过】` 与 `get_own_history` 工具覆盖。
memory:
  judgment_days: 5            # 未生效
  per_target: 3               # 未生效
  ignored_focus: 0.7          # 未生效

pending_action_ttl_h: 24

llm_down:
  consecutive: 5
  minutes: 10

attention:
  shadow_mode: false           # 已过 shadow 观测期（≥3 个交易日，见 RUNBOOK §10），正式启用
