# agent 段的全部阈值（批2）。阈值只住在这里，代码里不写默认值。
heartbeat:
  base_min: 5
  tight_min: 2
  max_min: 10
  # 开盘与尾盘的密集时段：这两段是「错过就没了」的窗口
  tight:
    - ["09:15", "10:00"]
    - ["14:30", "15:00"]
  # 中午与午后刚开盘：没什么可看的，放松
  relaxed:
    - ["11:00", "11:30"]
    - ["13:00", "13:30"]

event:
  rounds: 3
  deadline_s: 25

heartbeat_turn:
  rounds: 6
  deadline_s: 60

context:
  max_chars: 6000
  sector_events: 8
  own_history: 10
  own_history_trim: 5

channel_b_daily_cap: 15        # 通道 B（agent 主动开口）的日上限；通道 A 不计入

fatigue:
  free: 10
  step: 5
  raise: 0.5

# ⚠️ **这三个键目前没有任何读取点**（`core/config.py` 只做类型校验与默认值）。
# 它们看着像"记忆驱动的焦点抑制"，实际并不生效——`ignored_focus: 0.7` 尤其容易误导。
# 保留键名只是为了不改动「必填键」契约（删掉会让既有配置文件加载失败）。
# 记忆的读路径是 `agent/memory.py::recall()`（上限 MAX_RECALL=3，只在事件回合加载）；
# 写路径目前不存在，当日连续性由 `【我说过】` 与 `get_own_history` 工具覆盖。
memory:
  judgment_days: 5            # 未生效
  per_target: 3               # 未生效
  ignored_focus: 0.7          # 未生效

pending_action_ttl_h: 24

llm_down:
  consecutive: 5
  minutes: 10

attention:
  shadow_mode: false           # 已过 shadow 观测期（≥3 个交易日，见 RUNBOOK §10），正式启用
