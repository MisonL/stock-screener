[project]
name = "stock-screener"
version = "0.2.79"
description = "A 股盘后选池与盘中盯盘 agent"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 需要真实依赖容器（ntfy）的集成测试，只有 make test-integration 会跑",
]
