direct_connection: true                                        # §6.2：httpx 直连，不走系统代理（trust_env=False 的配置侧开关）

universe:
  min_bars: 265
  box_amount_ratio: 0.6
  suspend_max_in_250: 60
  resume_cooldown: 10
  pool_top_n: 100
  pool_alert_min: 30
  pool_overflow: 150
  price_eps: 0.011                                             # 价格相等容差（除权判定/快照对拍），代码里不得硬编码 0.011

box:
  min_n: 10
  max_lookback: 40                                             # (d) 的下界不在这里，按市场放在 by_market.today_low

decline:
  tail_max: 60
  min_len: 10
  discount_min_len: 5
  oneword_down_reject_at: 3

weights:
  A1: 15
  A2: 7
  A3: 8
  B2: 10
  B3: 7
  B4: 15
  B5: 10
  B6: 7
  B7: 7
  B9: 4
  D1: 4
  D2: 3
  D3: 3

mapping:
  b4: [0.275, 0.55, 0.75]
  b5_T: 35
  b7_T: 35
  surge_ratio: 1.2
  d2_last_days: 3
  d1_window: 20
  d1_min_bars: 15
  d1_sat: 0.10                                                 # D1「跑赢沪深300」满分点（§4.6.3：S=10%、L=0 退化）
  atr_n: 14
  pct_window: 250
  macd: [12, 26, 9]
  macd_warmup: 60

intraday:
  curve:
    "09:45": 0.19
    "10:00": 0.29
    "10:30": 0.43
    "11:00": 0.52
    "11:30": 0.59
    "13:30": 0.71
    "14:00": 0.78
    "14:30": 0.86
    "15:00": 1.00
  judge_start: "09:45"
  strict_until: "10:00"
  freeze_at: "14:57"
  c2: 1.5
  c2_strict: 2.5
  c2_down: 1.3
  c1_over_prev_close: 0.002
  halt_stale_s: 60
  stall:
    vol: 1.5
    window_min: 30
    max_gain: 0.005
    limit_gap: 0.003
  # 价格类信号（breakout/breakdown/near_breakout/stall）的**重新武装冷却期**（分钟）。
  # 条件消失一个 tick 就重置的话，价格在上沿附近抖动会让同一只票几秒一报：
  # 不做冷却的话，价格在上沿附近抖动时同一只票会几秒一报，还会挤进同一批推送
  # 重复出现多次（实测过：一只票 8 分钟十几条）。
  price_rearm_min: 30
  index_move:
    window_s: 300
    threshold: 0.010
    cooldown_min: 30
    codes: [sh000001, sz399001, sz399006, sh000688]
  sector_move:
    window_s: 300
    threshold: 0.020
    min_members: 10
    cooldown_min: 30
  watch:
    pct:
      cn_main: 0.05
      cn_gem: 0.08
      cn_star: 0.08
      cn_bse: 0.05
    vol_ratio: 2.0
    near_extreme: 0.01
    extreme_days: 60
  auction:
    gap: 0.02
    vol_mult: 3.0
    baseline_days: 20

attention:                                                     # §5.4.3 的公式与初始值；第一批 jobs 算 event_log.salience，第二批复用
  base:
    index_move: 0.70
    sector_move: 0.50
    breakdown: 0.45
    watch_rule: 0.45
    breakout: 0.40
    auction_anomaly: 0.35
    stall: 0.30
    near_breakout: 0.25
    data_anomaly: 0.00
  breadth:
    stock: 0.0
    sector_merged_3: 0.30
    market: 0.60
  focus:
    # market / sector 两档必须显式给：指数与板块事件没有「池内/自选」归属，
    # 若落到 outside=0.5，index_move 0.70×0.5=0.35 < salience_min 0.50 → 入库即 suppressed，
    # 大盘暴跌日 agent 永远不被唤醒（attention.base 里 index_move/sector_move 成死配置）。
    outside: 0.5
    pool: 1.0
    watch: 1.3
    market: 1.0
    sector: 1.0
  salience_min: 0.50

by_market:                                                     # §4.4 六市场数值表；A1/A2 按 §4.4.0 一律取主板值
  # 口径：百分比/幅度类参数一律以比值存（0.5% → 0.005，12% → 0.12）；消费方按 `price × (1 + c1_buffer)` 使用
  cn_main:
    box_range: 0.15
    daily_amp: 0.03
    slope: 0.0015
    b2_T: 0.12
    b3_T: 0.025
    c1_buffer: 0.005
    c3: 0.07
    b8_buffer: 0.98
    today_low: 0.98
    a1: [0.20, 0.35, 0.45, 0.60]
    a2_T: 0.08
    a3_zero: 0.0015
    b6_T: 0.06
    b9_T: 0.012
    near_breakout: 0.01
    min_amount_20d: 5.0e+7
  cn_gem:
    box_range: 0.30
    daily_amp: 0.06
    slope: 0.0030
    b2_T: 0.24
    b3_T: 0.05
    c1_buffer: 0.010
    c3: 0.14
    b8_buffer: 0.96
    today_low: 0.96
    a1: [0.20, 0.35, 0.45, 0.60]
    a2_T: 0.08
    a3_zero: 0.0030
    b6_T: 0.12
    b9_T: 0.024
    near_breakout: 0.02
    min_amount_20d: 5.0e+7
  cn_star:                                                     # 与 cn_gem 逐项同值（含 today_low: 0.96）
    box_range: 0.30
    daily_amp: 0.06
    slope: 0.0030
    b2_T: 0.24
    b3_T: 0.05
    c1_buffer: 0.010
    c3: 0.14
    b8_buffer: 0.96
    today_low: 0.96
    a1: [0.20, 0.35, 0.45, 0.60]
    a2_T: 0.08
    a3_zero: 0.0030
    b6_T: 0.12
    b9_T: 0.024
    near_breakout: 0.02
    min_amount_20d: 5.0e+7
  cn_bse:
    box_range: 0.45
    daily_amp: 0.09
    slope: 0.0045
    b2_T: 0.36
    b3_T: 0.075
    c1_buffer: 0.015
    c3: 0.21
    b8_buffer: 0.94
    today_low: 0.94
    a1: [0.20, 0.35, 0.45, 0.60]
    a2_T: 0.08
    a3_zero: 0.0045
    b6_T: 0.18
    b9_T: 0.036
    near_breakout: 0.03
    min_amount_20d: 1.0e+7
