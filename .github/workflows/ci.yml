name: CI

# 公开仓库的常规门禁：改完代码推上来，这里跑一遍和后端 `make test` 等价的检查。
#
# **构建走 deploy/Dockerfile 的 dev 阶段**，不在 runner 上装 Python 依赖：
# 生产镜像与 dev 镜像是同一套 3.12 + TA-Lib + Node，CI 用同一份定义才不会出现
# 「CI 绿、线上红」。TA-Lib 在 manylinux 有预编译 wheel，Docker 构建不需要编译 C 库。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支的新推送取消上一次，省 runner 时间
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # test_version.py 会校验「当前版本必须有对应 tag」，浅克隆拿不到 tag 就必红
          fetch-depth: 0
          fetch-tags: true

      - name: 构建 dev 镜像
        run: docker build --target dev -t ss-dev -f deploy/Dockerfile .

      - name: pytest
        # 挂载方式与 Makefile 的 `make test` 一致；runner 上 $PWD 就是仓库根。
        # **`--tmpfs /tmp:rw,exec` 必须和 Makefile 同步**：2026-11-21 的磁盘事故
        # 就是"测试临时文件写进容器可写层、容器还不删"——CI runner 虽然是一次性的，
        # 但 tmpfs 让临时文件**物理上不可能落到磁盘**，`size=2g` 再封个顶。
        # `exec` 不能省：`--tmpfs` 默认 `noexec`，/tmp 里的 fake git 会执行失败。
        run: docker run --rm --tmpfs /tmp:rw,exec,size=2g -v "$PWD":/app -w /app ss-dev pytest -q

  version:
    name: 版本门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本门禁要读 tag，浅克隆拿不到
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # **不能只装 pytest**：`tests/conftest.py` 会 import httpx 等运行时依赖，
      # 少一个就 `ModuleNotFoundError`（第一次跑 CI 就栽在这）。装 dev 全闭包。
      - run: pip install -r requirements-dev.txt

      # 纯文本检查，不构建镜像。它要在「改完版本、跑全量测试之前」尽快反馈，
      # 所以只跑这一个文件——但依赖必须齐。
      - run: python -m pytest -q tests/test_version.py

  frontend:
    name: 前端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 注意：**不要设 NODE_ENV=production**，那样 npm 会跳过 devDependencies，
      # vitest 根本装不上（本地踩过这个坑）。
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --reporter=dot
      - run: npm run build

  secrets:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 规则在 scripts/scan_secrets.py 里，有对应单测（tests/test_scan_secrets.py）。
      # **不要在 YAML 里写一条大正则**：版本号和私网地址在文本上长得一样，
      # 误报会把这条门禁变成噪音，最后没人看。脚本用 ipaddress 模块解析，
      # 天生不会把版本号当 IP。
      # ⚠️⚠️ **不按文件名排除**（2026-11-26 修）。
      #
      # 原实现整份跳过 `scripts/scan_secrets.py` 与 `tests/test_scan_secrets.py`，
      # 理由是"扫自己必然误报"。后果是这两个文件变成**扫描盲区** ——
      # 而它们恰恰是最容易被贴上真实凭据的地方（写规则要举例、写测试要造样本）。
      # `[实测]` 2026-11-26：GitGuardian 报的正是这两份文件里的示例行
      # （假值、误报），而**本仓库自己的门禁对它们是全盲的**：真凭据贴进
      # 同一个位置，CI 一声不响，只能指望外部的 GitGuardian。
      #
      # 现在改成**按整行白名单**（`scan_secrets._SAMPLE_LINES`，存 sha256）：
      # 文件照扫，只有那份已知示例行白名单豁免（`_SAMPLE_LINES`）。
      # 判据从"文件名"收窄到"整行内容"，
      # 有人在示例里贴真凭据时照样报。
      - name: 扫描工作区
        run: |
          set -euo pipefail
          git ls-files | xargs cat | python3 scripts/scan_secrets.py

      # ⚠️ `--pretty=format:` 只留 diff、去掉提交头与提交说明。
      # 2026-11-26：第一次全量扫描就红了 —— 命中的不是代码，而是**我自己的
      # commit message**（里面为了说明误报，引用了 PEM 私钥头这个字面串）。
      # 提交说明不是"曾经进过仓库的文件内容"，把它并进来只会让人不敢描述问题；
      # 真要管提交说明，得另设机制，而不是混进这条"扫文件历史"的门禁里。
      - name: 扫描全部历史
        run: |
          git log --all -p --pretty=format: -- . | python3 scripts/scan_secrets.py
