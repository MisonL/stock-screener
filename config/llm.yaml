# LLM 通道（批2）。`llm:` 与 `retry:` 是**根级并列键**：重试策略读 cfg.retry，不是 cfg.llm.retry。
llm:
  # **必须改成你自己的 OpenAI 兼容端点**：这里放的是占位值，任何 provider 都可以
  # （官方 API、自建网关、本地 ollama 都行）。也可以用环境变量 `LLM_BASE_URL` 覆盖。
  # 不要把别人部署的中转站写进默认值——新用户不核对就会把自己的 API key 发过去。
  base_url: https://api.example.com/v1
  api_key_env: DEEPSEEK_API_KEY     # 密钥从环境变量读，yaml 里只放变量名
  model: deepseek-flash
  thinking: disabled                # 默认关闭；要开时 max_tokens 须 ≥2000

  timeouts:
    agent_call_s: 20
    chat_s: 60
  max_tokens:
    plain: 800
    tools: 2000
  # [输入上限, 输出上限]；agent 与对话两个池各算各的（对话烧爆不该让盯盘闭嘴）
  budget:
    # 预算是**保守预扣**：每个 attempt 发出前扣「字符数×1.2 + max_tokens」，
    # 之后不退款。实测预扣约为真实用量的 3.2 倍（7 个真实回合：
    # 实际 in=91998，预算表扣了 290461）。
    # 原值 300000 在正式模式下只够 **7 个回合**就报「日预算已用完」，
    # 而一个交易日正常要 20–60 个回合（心跳每 10 分钟一次 ≈ 34 次 + 事件唤醒）。
    # 按 60 回合 × 每回合预扣 41494 反推 ≈ 2.5M，这里留 1500000（约 37 回合）
    # 作为「够用但不失控」的档位：实测日均真实成本约 1.7 元，本档上限约 4.6 元/天。
    agent: [1500000, 200000]
    chat: [200000, 20000]
  pricing:                          # 只用于日志页的 cost_cny，不是账单
    in_cny_per_mtok: 2.0
    out_cny_per_mtok: 8.0
    is_estimate: true

retry:
  max_attempts: 3                   # 含首次，即最多 2 次重试
  backoff: [0.5, 1.0]               # 秒，各加 ±30% 抖动
  retry_on: [502, 503, 504, timeout, empty_body, http_000]
  never_retry: [400, 401, 403]
