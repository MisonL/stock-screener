# public_host 必须与 cf/config.yml 的第一个 hostname、deploy/ntfy/server.yml 的 base-url 同域；
# 占位符统一用 example.com 系，换域名时三处一起改（RUNBOOK 第 1 节有清单）。
public_host: stock.example.com
ntfy_url: http://ntfy:2586
topic: stock-alerts
daily_cap: 60
dedupe_min: 30
p1_merge:
  count: 3
  window_s: 60
sector_merge:
  count: 3
  window_s: 300
overflow_digest_s: 300
open_brief_top: 15
p0:
  score: 80
  vol: 2.5
#: 突破从 P1 降级成 P2 的**分数下限**。`0` = 不设闸门（非 P0 的突破一律 P1），
#: 这与 v0.2.104 及之前的行为完全相同。v0.2.105 之前这个键**全仓零读取**，
#: 写 60 也不会有任何效果——现在它真的生效了。
p1_score: 0
